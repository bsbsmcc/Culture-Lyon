name: Aggregate ICS calendars

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "calendars.yaml"
      - "aggregate.py"
      - "scrapers/**"
      - "requirements.txt"
      - ".github/workflows/aggregate.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers
        run: |
          for s in scrapers/*.py; do
            echo "=== Running $s ==="
            python "$s" || echo "Scraper $s failed but we continue"
          done

      - name: Run aggregator
        run: python aggregate.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
