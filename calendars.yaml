# ====================================================================
# Configuration de l'agrégateur de calendriers ICS
# --------------------------------------------------------------------
# - "name"     : nom du calendrier combiné (visible dans Outlook)
# - "timezone" : fuseau horaire par défaut
# - "calendars": liste des sources. Pour chacune :
#     * name   : identifiant unique (libre, mais doit être stable)
#     * prefix : (optionnel) préfixe ajouté au titre des événements,
#                ex. "[ENG] Réunion équipe" — pratique pour identifier
#                la source dans la vue calendrier
#     * url    : URL du flux ICS (https:// ou webcal://) OU chemin
#                local (ex. "docs/maison-de-la-danse.ics") généré par
#                un scraper situé dans scrapers/
# ====================================================================

name: "Culture Lyon"
timezone: "Europe/Paris"

calendars:
  # ---- Flux ICS publics découverts ----
  - name: "office-tourisme-lyon"
    # Office de Tourisme — agenda patrimoine/jardins (271 événements)
    url: "https://openagenda.com/agendas/2248799/events.v2.ics?relative%5B0%5D=current&relative%5B1%5D=upcoming"

  - name: "opera-lyon"
    prefix: "OPÉRA"
    url: "webcal://calendbar.com/feeds/77?categories=c4"

  - name: "musee-confluences"
    prefix: "CONFLUENCES"
    url: "webcal://calendbar.com/feeds/83?categories=c10"

  - name: "villeurbanne-tnp"
    # Agenda Villeurbanne (couvre TNP avec ~10 événements)
    url: "https://openagenda.com/agendas/1168665/events.v2.ics?relative%5B0%5D=current&relative%5B1%5D=upcoming"

  # ---- Sources scrapées par scrapers/ ----
  # Chaque scraper produit un .ics dans docs/ que l'aggregator inclut
  - name: "maison-de-la-danse"
    url: "docs/maison-de-la-danse.ics"

  - name: "le-sucre"
    prefix: "SUCRE"
    url: "docs/le-sucre.ics"

